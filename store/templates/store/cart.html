{% extends 'store/main.html' %}
{% load static %}

{% block content %}

<div class="row">

    <div class="col-lg-12">
        <div class="box-element">
            <a class="btn btn-outline-dark" href="{% url 'store' %}">&#x2190; Continue Shopping</a>
            <br>
            <table class="table">

                <tr>
                    <th>Items : <strong>3</strong></th>
                    <th>Total amount : <strong>$126</strong></th>
                    <th><a style="float:right;" class="btn btn-success" href="{% url 'checkout' %}">Checkout</a></th>
                </tr>

            </table>
        </div>
        <br>
        <div class="box-element">
            <div class="cart-row">
                <div style="flex: 2;"></div>
                <div style="flex: 2;"><strong>Item</strong></div>
                <div style="flex: 1;"><strong>Price</strong></div>
                <div style="flex: 1;"><strong>Quantity</strong></div>
                <div style="flex: 1;"><strong>Total</strong></div>
            </div>
            <div class="cart-row">
                <div style="flex: 2;"><img style="top: 0;"  class="row-image"  src="{% static 'images/no-img.webp' %}" alt="product-img"></div>
                <div style="flex: 2;">Item</div>
                <div style="flex: 1;">Price</div>
                <div style="flex: 1; flex-wrap: wrap; display: flex;">
                    2
                    <div style="display: flex;flex-direction: column;padding-left: 5px;top: 0;">

                        <img class="chg-quantity"  src="{% static 'images/arrow-up.png' %}" alt="up">
                        <img class="chg-quantity"  src="{% static 'images/arrow-down.png' %}" alt="down">

                    </div>
                </div>
                <div style="flex: 1;">$45</div>
            </div>
        </div>
    </div>


</div>

{% endblock %}
