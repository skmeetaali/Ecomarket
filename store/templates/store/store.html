{% extends 'store/main.html' %}
{% load static %}

{% block content %}

<div class="row">

{% for product in products %}
    <div class="col-lg-4">
        <img class="thumbnail" src="{% static 'images/no-img.webp' %}" alt="">
        <div class="box-element product">
            <h5><strong>{{product.name}}</strong></h5>
            <hr>
            <button class="btn btn-outline-secondary add-button">Add to cart</button>
            <a class="btn btn-outline-success" href="#">View</a>
            <h4 style="float: right;">$20</h4>

        </div>
    </div>
{% endfor %}
</div>

{% endblock %}
